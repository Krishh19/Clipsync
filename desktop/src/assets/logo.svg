<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121528" />
      <stop offset="50%" stop-color="#1A1D36" />
      <stop offset="100%" stop-color="#0B0D18" />
    </linearGradient>

    <!-- Ambient Glow Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <!-- Left Cyan Loop Gradient -->
    <linearGradient id="cyanLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Right Violet Loop Gradient -->
    <linearGradient id="violetLoopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="40%" stop-color="#E100FF" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Shadow for Depth -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="230" fill="url(#ambientGlow)" />

  <!-- Squircle Base with Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="105" ry="105" fill="url(#bgGrad)" filter="url(#dropShadow)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="3" />

  <!-- Inner Soft Highlight Border -->
  <rect x="42" y="42" width="428" height="428" rx="100" ry="100" fill="none" stroke="rgba(255, 255, 255, 0.06)" stroke-width="1.5" />

  <!-- The Interlocking Clip & Sync Emblem -->
  <g transform="translate(256, 256) scale(0.95) translate(-256, -256)" filter="url(#neonGlow)">
    <!-- Right Violet/Pink Loop (Back) -->
    <rect x="260" y="146" width="100" height="220" rx="50" ry="50" fill="none" stroke="url(#violetLoopGrad)" stroke-width="32" stroke-linecap="round" />

    <!-- Left Cyan Loop (Middle) -->
    <rect x="152" y="146" width="100" height="220" rx="50" ry="50" fill="none" stroke="url(#cyanLoopGrad)" stroke-width="32" stroke-linecap="round" />

    <!-- Overlap mask segment for 3D interlocking illusion -->
    <path d="M 310,146 A 50,50 0 0,1 360,196 L 360,256" fill="none" stroke="url(#violetLoopGrad)" stroke-width="32" stroke-linecap="round" />

    <!-- Central Glowing Transfer Node -->
    <circle cx="256" cy="256" r="16" fill="#FFFFFF" />
    <circle cx="256" cy="256" r="28" fill="#00F2FE" opacity="0.4" />
  </g>
</svg>
