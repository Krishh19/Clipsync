name: Release Builds

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows NSIS Installer
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Desktop Dependencies
        working-directory: desktop
        run: npm ci

      - name: Build Tauri NSIS Bundle
        working-directory: desktop
        run: npx @tauri-apps/cli build --bundles nsis

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Windows-Installer
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Mobile Dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build Release APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipSync-Android-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: ClipSync-Windows-Installer
          path: release-artifacts/windows

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: ClipSync-Android-APK
          path: release-artifacts/android

      - name: Generate SHA-256 Checksums
        run: |
          cd release-artifacts
          find . -type f -exec sha256sum {} + > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/windows/*.exe
            release-artifacts/android/*.apk
            release-artifacts/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
